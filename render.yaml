# Render Blueprint — the API.
#
# Checked in so the deployment is reviewable and reproducible rather than a set of
# fields somebody typed into a dashboard once. Render reads this when you create a
# Blueprint from the repo; the two `sync: false` values are prompted for, because a
# database URL and a signing secret do not belong in git.

services:
  - type: web
    name: client-requests-api
    runtime: node
    plan: free
    region: frankfurt # closest of Render's free regions to Beirut and the EU

    # `--include=dev` is required, not belt-and-braces. NODE_ENV=production below is
    # set for the build as well as the run, and npm omits devDependencies when it sees
    # it — which silently removes TypeScript and fails the build with `tsc: not found`.
    # The compiler is a build-time tool, so it belongs in devDependencies; the install
    # is what has to be told that a build is happening.
    #
    # npm workspaces installs both packages; only the server is built and run.
    buildCommand: npm install --include=dev && npm run build --workspace server

    # Migrations belong in a pre-deploy step, which the free tier does not offer, so
    # they run on boot instead. That is safe *here* and not in general: the runner
    # records applied files and wraps each in a transaction, so re-running is a no-op,
    # and this plan is a single instance so there is no second replica to race. On two
    # replicas both would start migrating at once — which is exactly what a pre-deploy
    # step exists to prevent. Moving to a paid plan means moving this line back to
    # `preDeployCommand`, and nothing else changes.
    #
    # `&&` matters: the runner exits non-zero on a failed migration, so a bad schema
    # change fails the deploy instead of booting a server against a database it does
    # not match.
    startCommand: npm run migrate --workspace server && npm start --workspace server

    # A process that is up but cannot reach Postgres is not healthy. This endpoint
    # pings the database, so Render's probe fails when the database is unreachable
    # instead of reporting green.
    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      # Neon's pooled connection string. Change `sslmode=require` to
      # `sslmode=verify-full` — it is what node-postgres does today anyway, and
      # naming it avoids a deprecation warning on every boot.
      - key: DATABASE_URL
        sync: false

      # Generate with: openssl rand -base64 32
      - key: AUTH_SECRET
        sync: false

      # The Vercel origin. Comma-separated if you ever need more than one.
      - key: CORS_ORIGIN
        sync: false

      # Mounts the rate-limited reset endpoint, so a visitor who marks everything
      # done cannot spoil the demo for the next one.
      - key: DEMO_MODE
        value: 'true'

      - key: DEMO_USER_EMAIL
        value: ops@example.com
      - key: DEMO_USER_PASSWORD
        value: demo1234
